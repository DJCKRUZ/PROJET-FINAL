<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Explorateur de Films — mini application pour rechercher et afficher des films">
        <title>CinéExplorer — Explorateur de Films</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="brand">
                <div class="logo">🎬</div>
                <div>
                    <h1>CinéExplorer</h1>
                    <p class="tag">Découvrez et explorez vos films préférés</p>
                </div>
            </div>

            <nav class="filters">
                <button class="filter-btn" data-genre="all">Tous</button>
                <button class="filter-btn" data-genre="Action">Action</button>
                <button class="filter-btn" data-genre="Drama">Drame</button>
                <button class="filter-btn" data-genre="Comedy">Comédie</button>
                <button class="filter-btn" data-genre="Sci-Fi">Science-Fiction</button>
            </nav>
        </header>

        <section class="search-area">
            <div class="search-box">
                <input id="searchInput" placeholder="Rechercher un film...">
                <button id="searchBtn">🔎 Rechercher</button>
            </div>
        </section>

        <main>
            <section id="moviesGrid" class="grid" aria-live="polite"></section>
        </main>

        <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
            <div class="modal-content">
                <button id="closeModal" class="close" aria-label="Fermer">✕</button>
                <div id="modalBody"></div>
            </div>
        </div>

        <footer class="site-footer">Développé pour le projet — Profil Final</footer>

        <script src="js/app.js"></script>
        </body>
    </html>
